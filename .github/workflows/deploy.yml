name: Deploy to GitHub Pages

# 构建 dist 并发布到 GitHub Pages。
# 前提：仓库 Settings -> Pages -> Source 选择 "GitHub Actions"。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本从 package.json 的 packageManager 字段读取（pnpm@10.18.2）
      - uses: pnpm/action-setup@v4

      # @sqlite.org/sqlite-wasm 要求 Node >= 22（单测在 node 下跑真实 SQLite）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          # 项目页部署在 /<repo>/ 子路径下
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
